body {
    margin: 0;
    background: #111;
    color: white;

}

header {
    background: #1b1b1b;
    padding: 20px;
    text-align: center;
    border-bottom: 3px solid #ff7a00;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

header p {
    margin: 6px 0 12px;
    color: #aaa;
}

#activarSonido {
    background: #ff7a00;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

#pedidos {

    margin: auto;
}

.pedido {

    margin-bottom: 18px;

}

.cabecera {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.mesa {
    font-size: 25px;
    font-weight: bold;
}

.estado {

    padding: 7px 12px;

    font-weight: bold;
}

.productos {
    margin-top: 18px;
}

.producto {
    padding: 9px 0;
    border-bottom: 1px solid #333;
    font-size: 17px;
}

.observaciones {
    margin-top: 15px;
    background: #292929;
    padding: 12px;
    border-radius: 10px;
    color: #ddd;
}

.total {
    text-align: right;
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
    color: #ff8a00;
}

.botones {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.botones button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.preparar {
    background: #ff7a00;
    color: white;
}

.entregar {
    background: #2e9b55;
    color: white;
}

.vacio {
    text-align: center;
    color: #888;
    padding: 60px 20px;
    font-size: 18px;
}

.error {
    text-align: center;
    color: #ff5555;
    padding: 30px;
}
