<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alta Pinta | Parrilla & Bebidas</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: 'Montserrat', sans-serif;
}

header {
    min-height: 280px;
    padding: 60px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
        url("https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1400&q=80")
        center/cover;
}

header h1 {
    margin: 0;
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    letter-spacing: 3px;
}

header p {
    margin-top: 8px;
    font-size: 16px;
    letter-spacing: 2px;
}

.container {
    width: 92%;
    max-width: 900px;
    margin: auto;
    padding-bottom: 180px;
}

h2 {
    margin-top: 35px;
    border-left: 5px solid #ff7a00;
    padding-left: 12px;
}

.producto {
    background: #1d1d1d;
    border-radius: 15px;
    padding: 18px;
    margin: 15px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,.25);
}

.producto h3 {
    margin: 0 0 6px;
}

.precio {
    color: #ff8a00;
    font-weight: 700;
    font-size: 17px;
}

.producto button {
    background: #ff7a00;
    color: white;
    border: none;
    padding: 11px 15px;
    border-radius: 9px;
    font-weight: 700;
    cursor: pointer;
}

.producto button:active {
    transform: scale(.96);
}

#carrito {
    margin-top: 40px;
    background: #191919;
    border-radius: 18px;
    padding: 20px;
}

.item-carrito {
    border-bottom: 1px solid #333;
    padding: 15px 0;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
}

.controles {
    display: flex;
    align-items: center;
    gap: 8px;
}

.controles button {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 7px;
    background: #ff7a00;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.cantidad {
    min-width: 22px;
    text-align: center;
    font-weight: 700;
}

.eliminar {
    background: #b52b2b;
    color: white;
    border: none;
    border-radius: 7px;
    padding: 8px 10px;
    cursor: pointer;
}

.total {
    text-align: right;
    font-size: 22px;
    font-weight: 800;
    margin-top: 20px;
}

.pedir {
    width: 100%;
    margin-top: 20px;
    padding: 17px;
    background: #ff7a00;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
}

.vacio {
    color: #aaa;
    text-align: center;
    padding: 20px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}

.modal-box {
    background: #202020;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

.modal-box .check {
    font-size: 55px;
}

.modal-box h2 {
    border: none;
    padding: 0;
    margin: 10px 0;
}

.modal-box button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #ff7a00;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

    header h1 {
        font-size: 38px;

    .producto {
        flex-direction: column;

        width: 100%;

    }
